<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Command Dashboad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div id="live-clock">00:00:00</div>
        <div id="greeting-text">Initializing Dashboard...</div>

        <div class="input-group">
            <input type="text" id="user-input" placeholder="Enter Name,Color Name,Google">
        </div>
        <button id="action-btn">Execute Command</button>
        <p id="reply-text"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
